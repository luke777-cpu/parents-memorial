<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>일괄 업로드 (임시)</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body{font-family:sans-serif;max-width:640px;margin:40px auto;padding:0 16px;line-height:1.6;}
  button{font-size:16px;padding:10px 20px;margin:8px 0;cursor:pointer;}
  #log{white-space:pre-wrap;background:#f5f5f5;padding:12px;border-radius:8px;font-size:13px;max-height:400px;overflow-y:auto;margin-top:16px;}
  .ok{color:#2e7d32;} .err{color:#c62828;} .info{color:#555;}
  #pw{font-size:16px;padding:8px;width:200px;}
</style>
</head>
<body>
<h2>가족사진 일괄 업로드 (임시 페이지)</h2>
<p>이 페이지는 사진 84장을 앨범별로 한 번에 올리기 위한 임시 도구입니다. 완료 후 삭제됩니다.</p>
<p>이름: <select id="name">
  <option value="keunnuna">큰누나</option>
  <option value="duljjae">둘째 누나</option>
  <option value="maknae">막내 누나</option>
  <option value="namdongsaeng">남동생</option>
  <option value="bonin" selected>본인</option>
</select>
비밀번호: <input id="pw" type="password"></p>
<button id="startBtn">업로드 시작</button>
<div id="log"></div>

<script>
const SUPABASE_URL = 'https://dbislfyxpztkqpgswpok.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_qjCxbQ0W44jxKTuEYKDcJA_5hZR16vF';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const REPO_RAW = 'https://raw.githubusercontent.com/luke777-cpu/parents-memorial/main/bulk-upload-temp/imgs/';
const MANIFEST_URL = 'https://raw.githubusercontent.com/luke777-cpu/parents-memorial/main/bulk-upload-temp/manifest.json';

const logEl = document.getElementById('log');
function log(msg, cls){
  const line = document.createElement('div');
  if(cls) line.className = cls;
  line.textContent = msg;
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
}

document.getElementById('startBtn').addEventListener('click', async () => {
  document.getElementById('startBtn').disabled = true;
  const name = document.getElementById('name').value;
  const pw = document.getElementById('pw').value;
  if(!pw){ log('비밀번호를 입력하세요.', 'err'); document.getElementById('startBtn').disabled=false; return; }
  const email = name + '@bumo.family';

  log('로그인 시도: ' + email, 'info');
  const { data: signInData, error: signInErr } = await sb.auth.signInWithPassword({ email, password: pw });
  if(signInErr){
    log('로그인 실패: ' + signInErr.message, 'err');
    document.getElementById('startBtn').disabled=false;
    return;
  }
  log('로그인 성공: ' + signInData.user.email, 'ok');
  const { data: sessionCheck } = await sb.auth.getSession();
  log('세션 확인: role=' + (sessionCheck.session ? 'authenticated' : '없음') + ', access_token 존재=' + !!(sessionCheck.session && sessionCheck.session.access_token), 'info');

  const manifest = await (await fetch(MANIFEST_URL)).json();
  const albumNames = Object.keys(manifest);
  log('앨범 ' + albumNames.length + '개, 사진 ' + Object.values(manifest).flat().length + '장 준비됨', 'info');

  // 기존 앨범 조회
  const { data: existingAlbums, error: albErr } = await sb.from('albums').select('*');
  if(albErr){ log('앨범 조회 실패: ' + albErr.message, 'err'); return; }
  const albumIdByName = {};
  (existingAlbums || []).forEach(a => { albumIdByName[a.name] = a.id; });

  // 없는 앨범 생성
  for(const name of albumNames){
    if(!albumIdByName[name]){
      const { data: newAlb, error: createErr } = await sb.from('albums').insert({ name }).select().single();
      if(createErr){
        log('앨범 생성 실패 (' + name + '): ' + createErr.message + ' | code=' + createErr.code + ' | details=' + createErr.details + ' | hint=' + createErr.hint, 'err');
        continue;
      }
      albumIdByName[name] = newAlb.id;
      log('앨범 생성됨: ' + name, 'ok');
    } else {
      log('기존 앨범 사용: ' + name, 'info');
    }
  }

  let done = 0, failed = 0;
  const total = Object.values(manifest).flat().length;

  for(const [albumName, files] of Object.entries(manifest)){
    if(albumName === '여행'){ log('여행 앨범은 이미 완료되어 건너뜀', 'info'); done += files.length; continue; }
    const albumId = albumIdByName[albumName];
    if(!albumId){ log('앨범ID 없음, 스킵: ' + albumName, 'err'); continue; }
    for(const filename of files){
      try{
        const resp = await fetch(REPO_RAW + encodeURIComponent(filename));
        if(!resp.ok) throw new Error('원본 파일 fetch 실패 ' + resp.status);
        const blob = await resp.blob();
        const storagePath = 'gallery/' + Date.now() + '_' + Math.random().toString(36).slice(2) + '.jpg';
        const { error: upErr } = await sb.storage.from('photos').upload(storagePath, blob, { contentType: 'image/jpeg' });
        if(upErr) throw upErr;
        const { data: pub } = sb.storage.from('photos').getPublicUrl(storagePath);
        const { error: insErr } = await sb.from('photos').insert({
          album_id: albumId,
          author_email: email,
          url: pub.publicUrl,
          caption: ''
        });
        if(insErr){
          insErr.message = insErr.message + ' | code=' + insErr.code + ' | details=' + insErr.details + ' | hint=' + insErr.hint;
          throw insErr;
        }
        done++;
        log(`[${done}/${total}] ${albumName} <- ${filename} OK`, 'ok');
      }catch(e){
        failed++;
        log(`실패: ${albumName} / ${filename} : ${e.message||e}`, 'err');
      }
    }
  }

  log(`완료: 성공 ${done}장, 실패 ${failed}장`, done===total?'ok':'err');
  document.getElementById('startBtn').disabled=false;
});
</script>
</body>
</html>
