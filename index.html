<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우리 가족의 기억</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  .family-home { max-width:none; padding:0 0 90px; }
  .mother-hero {
    position:relative;
    overflow:hidden;
    background:#eee9e1;
  }
  .mother-hero-photo { position:relative; z-index:0; }
  .mother-hero-photo img {
    width:100%;
    height:auto;
    display:block;
  }
  .mother-hero-overlay {
    position:absolute;
    inset:0;
    z-index:1;
    pointer-events:none;
    background:
      linear-gradient(0deg, rgba(250,247,240,.96) 0%, rgba(250,247,240,.78) 18%, rgba(250,247,240,.34) 38%, rgba(250,247,240,0) 56%);
  }
  .mother-hero-content {
    position:absolute;
    z-index:2;
    left:0; right:0; bottom:0;
    width:min(1180px, calc(100% - 56px));
    margin:0 auto;
    padding:0 0 44px;
  }
  .mother-hero-content > * { max-width:560px; }
  .mother-kicker {
    margin:0 0 18px;
    color:#66765a;
    font-size:13px;
    font-weight:600;
    letter-spacing:.08em;
  }
  .mother-hero h1 {
    font-size:clamp(38px, 4.6vw, 60px);
    line-height:1.2;
    letter-spacing:-.04em;
    color:#292925;
    text-shadow:0 1px 8px rgba(255,255,255,.45);
  }
  .mother-lead {
    margin:18px 0 0;
    color:#514d48;
    font-family:'Noto Serif KR',serif;
    font-size:18px;
    line-height:2;
    word-break:keep-all;
  }
  .mother-actions { display:flex; gap:12px; margin-top:24px; flex-wrap:wrap; }
  .mother-actions .family-btn { background:rgba(255,255,255,.78); backdrop-filter:blur(8px); }
  .mother-actions .family-btn.primary { background:#6f8260; }
  .mother-scroll {
    display:none;
    position:absolute;
    z-index:2;
    left:50%;
    bottom:24px;
    transform:translateX(-50%);
    color:rgba(55,52,48,.58);
    font-size:11px;
    letter-spacing:.03em;
    white-space:nowrap;
  }
  .mother-scroll span { display:inline-block; margin-left:7px; animation:motherDown 1.8s ease-in-out infinite; }
  @keyframes motherDown { 0%,100%{transform:translateY(0)} 50%{transform:translateY(5px)} }

  /* 등장 연출 */
  .mother-hero-content > * {
    opacity:0;
    transform:translateY(16px);
    animation:heroIn .9s cubic-bezier(.2,.7,.2,1) forwards;
  }
  .mother-kicker { animation-delay:.15s; }
  .mother-hero h1 { animation-delay:.3s; }
  .mother-lead { animation-delay:.5s; }
  .mother-actions { animation-delay:.7s; }
  @keyframes heroIn { to { opacity:1; transform:none; } }
  .mother-hero-photo img { animation:heroFade 1.4s ease-out both; }
  @keyframes heroFade { from { opacity:0; } to { opacity:1; } }

  /* 흐르는 사진첩 */
  .memory-strip-wrap { margin:64px 0 8px; overflow:hidden; }
  .strip-kicker {
    width:min(1180px, calc(100% - 56px));
    margin:0 auto 18px;
    color:#66765a; font-size:13px; font-weight:600; letter-spacing:.08em;
  }
  .memory-strip { overflow:hidden; -webkit-mask-image:linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent); mask-image:linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent); }
  .strip-track {
    display:flex; gap:22px; width:max-content;
    animation:stripDrift 75s linear infinite;
    padding:14px 0 22px;
  }
  .memory-strip:hover .strip-track { animation-play-state:paused; }
  .strip-photo {
    background:#fff; padding:8px 8px 22px;
    box-shadow:0 6px 20px rgba(60,54,44,.13);
    border-radius:3px; flex-shrink:0;
  }
  .strip-photo:nth-child(odd) { transform:rotate(-1.1deg); }
  .strip-photo:nth-child(even) { transform:rotate(.9deg); }
  .strip-photo img { height:150px; width:auto; display:block; border-radius:2px; }
  @keyframes stripDrift { from { transform:translateX(0); } to { transform:translateX(-50%); } }

  @media (prefers-reduced-motion:reduce) {
    .mother-hero-content > *, .mother-hero-photo img { animation:none; opacity:1; transform:none; }
    .strip-track { animation:none; }
    .mother-scroll span { animation:none; }
  }
  .family-note { margin-top:72px; }
  .family-menu-grid, .family-story, .family-footer-note { width:min(1180px, calc(100% - 56px)); }
  .family-menu-grid { margin-left:auto; margin-right:auto; }
  @media (max-width:760px) {
    .family-home { padding:0 0 96px; }
    .mother-hero { min-height:0; }
    .mother-hero-overlay { display:none; }
    .mother-hero-content {
      position:static;
      width:calc(100% - 36px);
      padding:26px 0 8px;
    }
    .mother-hero-content > * { max-width:100%; }
    .mother-kicker { font-size:12px; margin-bottom:8px; }
    .mother-hero h1 { font-size:clamp(32px, 9.5vw, 44px); }
    .mother-lead { margin-top:14px; font-size:15px; line-height:1.85; }
    .mother-actions { margin-top:20px; flex-direction:row; }
    .mother-actions .family-btn { width:auto; flex:1; min-width:135px; padding:0 14px; }
    .mother-scroll { display:none; }
    .memory-strip-wrap { margin:44px 0 4px; }
    .strip-kicker { width:auto; margin-left:16px; margin-right:16px; }
    .strip-photo img { height:108px; }
    .strip-track { gap:14px; }
    .family-note { margin:44px 16px 50px; }
    .family-menu-grid, .family-story, .family-footer-note { width:auto; margin-left:16px; margin-right:16px; }
  }
</style>
</head>
<body class="home-bright">
<div id="app"></div>

<script src="config.js"></script>
<script src="auth.js"></script>
<script>
requireFamilyAuth((member) => {
  document.getElementById('app').innerHTML = `
    ${navHtml('index.html')}

    <main class="family-home">
      <section class="mother-hero">
        <div class="mother-hero-photo" aria-hidden="true">
          <img src="assets/parents-hero.webp?v=1" alt="">
        </div>
        <div class="mother-hero-overlay" aria-hidden="true"></div>
        <div class="mother-hero-content">
          <p class="mother-kicker">우리 가족의 오래된 사진첩</p>
          <h1 class="serif">부모님을 기억하며</h1>
          <p class="mother-lead">사진을 펼치면<br>그날의 목소리와 표정이 다시 떠오릅니다.</p>
          <div class="mother-actions">
            <a href="gallery.html" class="family-btn primary">사진 보러가기</a>
            <a href="memories.html" class="family-btn">기억하는 이야기</a>
          </div>
        </div>
        <div class="mother-scroll">천천히 아래로 내려보세요 <span>↓</span></div>
      </section>

      <section class="memory-strip-wrap" id="memory-strip-wrap" hidden>
        <p class="strip-kicker">사진첩에서 꺼낸 조각들</p>
        <div class="memory-strip">
          <div class="strip-track" id="strip-track"></div>
        </div>
      </section>

      <section class="family-note">
        <p class="family-note-small">오늘의 한마디</p>
        <p class="family-note-text serif">“기억은 흐려져도, 함께했던 시간은 사라지지 않습니다.”</p>
      </section>

      <section class="family-menu-grid">
        <a href="gallery.html" class="family-tile"><span class="tile-icon">📷</span><strong>사진첩</strong><small>두 분의 여행과 일상</small></a>
        <a href="timeline.html" class="family-tile"><span class="tile-icon">🌿</span><strong>두 분의 시간</strong><small>살아오신 발자취</small></a>
        <a href="memories.html" class="family-tile"><span class="tile-icon">✍️</span><strong>기억하는 이야기</strong><small>가족이 남기는 글</small></a>
        <a href="guestbook.html" class="family-tile"><span class="tile-icon">💌</span><strong>가족의 한마디</strong><small>안부와 추억 나누기</small></a>
        <a href="father.html" class="family-tile"><span class="tile-icon">📖</span><strong>아버지의 시간</strong><small>1927년부터 이어진 삶</small></a>
      </section>

      <section class="family-story">
        <div class="story-line"></div>
        <p class="story-kicker">우리에게 남은 것</p>
        <h2 class="serif">사진 한 장이면<br>그날의 공기까지 떠오를 때가 있습니다.</h2>
        <p>여행지에서 나란히 서 있던 모습, 특별한 날의 표정, 평범했던 어느 날의 모습까지. 이곳은 슬픔만을 남기는 곳이 아니라, 가족이 함께 살아온 시간을 다시 꺼내보는 공간이었으면 합니다.</p>
      </section>

      <section class="family-footer-note">
        <p>${member.name}님, 오늘은 어떤 기억부터 꺼내볼까요?</p>
        <button class="logout text-logout" onclick="logout()">로그아웃</button>
      </section>
    </main>
  `;
  loadMemoryStrip();
});

async function loadMemoryStrip() {
  try {
    const { data, error } = await supabaseClient
      .from('photos')
      .select('url')
      .limit(60);
    if (error || !data || data.length < 4) return;
    const shuffled = data.sort(() => Math.random() - 0.5).slice(0, 14);
    const cards = shuffled.map(p => `<div class="strip-photo"><img src="${p.url}" alt="" loading="lazy"></div>`).join('');
    document.getElementById('strip-track').innerHTML = cards + cards; /* 끊김 없는 반복용 복제 */
    document.getElementById('memory-strip-wrap').hidden = false;
  } catch (e) { /* 사진을 못 불러오면 조용히 생략 */ }
}
</script>
</body>
</html>
