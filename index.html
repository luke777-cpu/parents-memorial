<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우리 가족의 기억</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="home-bright">
<div id="app"></div>

<script src="config.js"></script>
<script src="auth.js"></script>
<script>
requireFamilyAuth((member) => {
  document.getElementById('app').innerHTML = `
    ${navHtml('index.html')}

    <main class="family-home">
      <section class="family-hero">
        <div class="family-hero-photo">
          <img src="assets/mother-memory.svg" alt="어머니 사진" onerror="this.style.display='none'">
        </div>
        <div class="family-hero-copy">
          <p class="family-kicker">우리 가족의 오래된 사진첩</p>
          <h1 class="serif">함께여서<br>좋았던 날들</h1>
          <p class="family-lead">두 분이 함께 걸었던 길, 여행했던 곳, 웃었던 순간을<br>천천히 다시 꺼내보는 공간입니다.</p>
          <div class="family-actions">
            <a href="gallery.html" class="family-btn primary">사진 보러가기</a>

      </section>

      <section class="family-footer-note">
        <p>${member.name}님, 오늘은 어떤 사진부터 꺼내볼까요?</p>
